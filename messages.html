<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <meta name="theme-color" content="#2563eb" />
    <title>SkillSwap PH — Messages</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="style.css" rel="stylesheet" />

    <!-- Firebase SDK -->
    <script type="module">
        // Import Firebase SDKs
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";
        
        // Your Firebase config (REPLACE WITH YOUR ACTUAL CONFIG)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const messaging = getMessaging(app);
        
        // Make functions available globally
        window.requestNotificationPermission = async function() {
            try {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    console.log('Notification permission granted');
                    
                    // Get FCM token
                    const token = await getToken(messaging, {
                        vapidKey: "YOUR_VAPID_KEY" // Get from Firebase Console → Project Settings → Cloud Messaging
                    });
                    
                    console.log('FCM Token:', token);
                    
                    // Send token to your backend
                    const apiUrl = window.API_CONFIG?.BASE_URL || 'https://skillswapph-production.up.railway.app/api/v1';
                    const authToken = localStorage.getItem('access_token');
                    
                    const response = await fetch(`${apiUrl}/fcm/register-token`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${authToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ token: token })
                    });
                    
                    if (response.ok) {
                        console.log('Token registered successfully');
                        showToast('✅ Notifications enabled!');
                    }
                } else {
                    console.log('Notification permission denied');
                }
            } catch (error) {
                console.error('Error getting permission:', error);
            }
        };
        
        // Handle foreground messages
        onMessage(messaging, (payload) => {
            console.log('Message received:', payload);
            showToast(`🔔 ${payload.notification?.title || 'New notification'}: ${payload.notification?.body || ''}`);
            // Refresh conversations and messages if needed
            if (window.currentTab === 'conversations') {
                renderConversations();
            }
            if (window.currentChatUserId) {
                fetchMessages(window.currentChatUserId).then(data => {
                    window.chatHistory = data.messages || [];
                    renderChatMessages();
                });
            }
        });
        
        // Auto-request permission when page loads (only if user is logged in)
        if (localStorage.getItem('access_token')) {
            // Small delay to ensure page is ready
            setTimeout(() => {
                if (Notification.permission === 'default') {
                    window.requestNotificationPermission();
                }
            }, 2000);
        }
    </script>

    <style>
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
            box-sizing: border-box;
        }

        :root {
            --blue: #2563eb;
            --blue-dark: #1d4ed8;
            --blue-light: #eff6ff;
            --blue-mid: #dbeafe;
            --green: #10b981;
            --green-light: #dcfce7;
            --yellow: #f59e0b;
            --yellow-light: #fef9c3;
            --red: #ef4444;
            --red-light: #fee2e2;
            --text: #0f172a;
            --text-mid: #475569;
            --text-light: #94a3b8;
            --border: #e2e8f0;
            --bg: #f1f5f9;
            --white: #ffffff;
            --nav-h: 64px;
            --sidebar-w: 260px;

        html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .topnav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: var(--nav-h);
            background: var(--white); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 20px; gap: 16px;
        }
        .brand { display: flex; align-items: center; gap: 10px; min-width: 160px; }
        .brand-logo { width: 36px; height: 36px; border-radius: 10px; background: var(--blue); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .brand-name { font-size: 1rem; font-weight: 800; color: var(--text); white-space: nowrap; }
        .search-bar {
            flex: 1;
            max-width: 380px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 6px 12px;
        }
        .search-bar:focus-within { border-color: var(--blue); background: white; }
        .search-bar input { flex: 1; border: none; background: transparent; outline: none; font-size: 0.8rem; }
        .nav-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
        .nav-btn {
            width: 36px; height: 36px; border-radius: 10px; border: 1.5px solid var(--border);
            background: white; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-mid);
        }
        .nav-btn:hover { border-color: var(--blue); background: var(--blue-light); color: var(--blue); }
        .avatar-btn { width: 36px; height: 36px; border-radius: 10px; background: var(--blue); color: white; font-size: 0.8rem; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .hamburger { display: none; }
        .layout { display: flex; margin-top: var(--nav-h); min-height: calc(100vh - var(--nav-h)); }

        .sidebar {
            width: var(--sidebar-w); background: white; border-right: 1px solid var(--border);
            position: fixed; top: var(--nav-h); left: 0; height: calc(100vh - var(--nav-h));
            overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 6px; z-index: 50;
            transition: transform 0.3s ease;
        }
        .sidebar-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: var(--text-light); padding: 16px 10px 6px; }
        .sidebar-label:first-child { padding-top: 0; }
        .nav-link {
            display: flex; align-items: center; gap: 10px; padding: 9px 12px;
            border-radius: 10px; font-size: 0.85rem; font-weight: 500;
            color: var(--text-mid); cursor: pointer; text-decoration: none;
        }
        .nav-link:hover { background: var(--bg); color: var(--text); }
        .nav-link.active { background: var(--blue-light); color: var(--blue); font-weight: 700; }
        .logout-btn { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
        .btn-logout {
            width: 100%; padding: 9px; border-radius: 10px; border: 1.5px solid #fee2e2;
            background: #fff5f5; color: #ef4444; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 7px;
        }
        .btn-logout:hover { background: #ef4444; color: white; }

        .main { margin-left: var(--sidebar-w); flex: 1; padding: 28px 24px; }
        .page-header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .page-title { font-size: 1.4rem; font-weight: 800; color: var(--text); }
        .page-sub { font-size: 0.85rem; color: var(--text-mid); margin-top: 3px; }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }
        .tab-btn {
            padding: 8px 20px;
            border: none;
            background: none;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-mid);
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--blue-light);
            color: var(--blue);
        }
        .tab-btn:hover {
            background: var(--bg);
        }

        .messages-list { display: flex; flex-direction: column; gap: 8px; }
        .message-card {
            background: white; border-radius: 14px; border: 1.5px solid var(--border);
            padding: 14px 18px; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; gap: 14px;
        }
        .message-card:hover { border-color: var(--blue); box-shadow: 0 2px 12px rgba(37, 99, 235, 0.08); }
        .message-avatar {
            width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, #2563eb, #3b82f6);
            display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 1rem;
            flex-shrink: 0;
        }
        .message-content { flex: 1; }
        .message-sender { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .message-name { font-size: 0.9rem; font-weight: 700; color: var(--text); }
        .message-time { font-size: 0.7rem; color: var(--text-light); }
        .message-preview { font-size: 0.8rem; color: var(--text-mid); margin-top: 4px; }
        .unread-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); flex-shrink: 0; }

        .connected-list, .sessions-list {
            background: white;
            border-radius: 14px;
            border: 1.5px solid var(--border);
            max-height: 70vh;
            overflow-y: auto;
        }
        .connected-item, .session-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }
        .connected-item:last-child, .session-item:last-child { border-bottom: none; }
        .connected-item:hover, .session-item:hover { background: var(--blue-light); }
        .connected-avatar, .session-avatar {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .connected-info, .session-info { flex: 1; }
        .connected-name, .session-name { font-size: 0.85rem; font-weight: 700; color: var(--text); }
        .connected-skill, .session-skill { font-size: 0.7rem; color: var(--text-mid); }
        .session-date { font-size: 0.65rem; color: var(--blue); margin-top: 2px; }
        .session-status {
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 600;
        }
        .status-pending { background: var(--yellow-light); color: #a16207; }
        .status-confirmed { background: var(--green-light); color: #16a34a; }
        .status-completed { background: var(--blue-mid); color: var(--blue); }
        .status-cancelled { background: var(--red-light); color: var(--red); }
        .session-actions {
            display: flex;
            gap: 6px;
        }
        .session-action-btn {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .btn-confirm { background: var(--green-light); color: #16a34a; }
        .btn-confirm:hover { background: var(--green); color: white; }
        .btn-cancel { background: var(--red-light); color: var(--red); }
        .btn-cancel:hover { background: var(--red); color: white; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
            opacity: 0; visibility: hidden; transition: all 0.2s;
        }
        .modal-overlay.show { opacity: 1; visibility: visible; }
        .modal-container {
            background: white; border-radius: 20px; width: 90%; max-width: 500px;
            max-height: 80vh; overflow: hidden; display: flex; flex-direction: column;
        }
        .modal-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .modal-header h3 { font-size: 0.9rem; font-weight: 700; color: var(--text); }
        .modal-close { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-light); }
        .modal-body { padding: 14px 16px; overflow-y: auto; flex: 1; }

        .chat-messages { max-height: 400px; overflow-y: auto; padding: 10px; background: var(--bg); border-radius: 12px; margin-bottom: 12px; }
        .chat-message { margin-bottom: 12px; display: flex; flex-direction: column; }
        .chat-message.sent { align-items: flex-end; }
        .chat-message.received { align-items: flex-start; }
        .chat-bubble { max-width: 80%; padding: 8px 12px; border-radius: 16px; font-size: 0.75rem; word-wrap: break-word; }
        .chat-message.sent .chat-bubble { background: var(--blue); color: white; border-bottom-right-radius: 4px; }
        .chat-message.received .chat-bubble { background: white; border: 1px solid var(--border); color: var(--text); border-bottom-left-radius: 4px; }
        .attachment-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.2);
            padding: 4px 8px;
            border-radius: 8px;
            margin-top: 6px;
            font-size: 0.7rem;
            text-decoration: none;
            color: inherit;
        }
        .attachment-link:hover { text-decoration: underline; }
        .chat-time { font-size: 0.55rem; color: var(--text-light); margin-top: 2px; margin-left: 8px; margin-right: 8px; }
        .chat-input-area { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
        .chat-input-area input[type="text"] { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.75rem; outline: none; min-width: 120px; }
        .chat-input-area button { padding: 8px 14px; background: var(--blue); color: white; border: none; border-radius: 10px; font-size: 0.7rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .chat-input-area button:hover { background: var(--blue-dark); }
        .attach-btn { background: #64748b !important; }
        .attach-btn:hover { background: #475569 !important; }

        .propose-session-btn { background: #64748b !important; }
        .propose-session-btn:hover { background: #475569 !important; }

        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #0f172a; color: white; padding: 8px 16px; border-radius: 10px; font-size: 0.7rem; transition: transform 0.3s ease; z-index: 999; white-space: nowrap; }
        #toast.show { transform: translateX(-50%) translateY(0); }
        #navOverlay { display: none; position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, 0.35); backdrop-filter: blur(2px); }
        #navOverlay.show { display: block; }
        .empty-state { text-align: center; padding: 60px; color: var(--text-light); }

        @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; padding: 16px; }
    .hamburger { display: flex; }
    
    /* Header fixes */
    .topnav {
        display: flex !important;
        flex-wrap: nowrap !important;
        justify-content: space-between !important;
        gap: 8px !important;
        padding: 0 12px !important;
    }
    .brand { min-width: auto !important; flex-shrink: 0 !important; }
    .brand-name { display: none !important; }
    .search-bar { max-width: 100% !important; flex: 1 !important; min-width: 0 !important; }
    .search-bar input { font-size: 0.7rem !important; }
    .nav-actions { margin-left: 0 !important; display: flex !important; flex-direction: row !important; gap: 6px !important; flex-shrink: 0 !important; }
    .nav-btn, .avatar-btn { width: 32px !important; height: 32px !important; margin: 0 !important; flex-shrink: 0 !important; }
    .nav-btn svg { width: 14px !important; height: 14px !important; }
    .nav-btn .badge { top: -4px !important; right: -4px !important; min-width: 16px !important; height: 16px !important; font-size: 0.5rem !important; }
    
    /* Other existing styles */
    .brand { min-width: auto; }
    .brand-name { display: none; }
    .modal-container { width: 95%; margin: 10px; }
    .message-card { padding: 12px 14px; gap: 10px; }
    .message-avatar { width: 40px; height: 40px; font-size: 0.85rem; }
    .session-actions { flex-direction: column; }
    .chat-input-area { flex-wrap: wrap; }
    .chat-input-area button { padding: 6px 12px; font-size: 0.65rem; }
}
    </style>
</head>

<body>

    <div id="toast"></div>
    <div id="navOverlay" onclick="toggleSidebar()"></div>

    <!-- Chat Modal -->
    <div class="modal-overlay" id="chatModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="chatModalTitle">💬 Conversation</h3>
                <button class="modal-close" onclick="closeChatModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Type a message..." />
                    <input type="file" id="fileInput" style="display: none;" />
                    <button type="button" class="attach-btn" onclick="document.getElementById('fileInput').click()">📎</button>
                    <button type="button" onclick="sendChatMessage()">Send</button>
                    <button type="button" id="proposeSessionBtn" class="propose-session-btn" onclick="openProposeSessionModal()">📅 Propose Session</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Propose Session Modal -->
    <div class="modal-overlay" id="proposeSessionModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3>📅 Propose a Session</h3>
                <button class="modal-close" onclick="closeProposeSessionModal()">✕</button>
            </div>
            <div class="modal-body">
                <label style="font-size:0.7rem; font-weight:600;">Skill / Topic</label>
                <input type="text" id="sessionSkill" placeholder="e.g., React, Python, UI Design" style="width:100%; padding:10px; border:1px solid var(--border); border-radius:10px; margin-bottom:15px;" />
                
                <label style="font-size:0.7rem; font-weight:600;">Date & Time</label>
                <input type="datetime-local" id="sessionDateTime" style="width:100%; padding:10px; border:1px solid var(--border); border-radius:10px; margin-bottom:15px;" />
                
                <label style="font-size:0.7rem; font-weight:600;">Notes (optional)</label>
                <textarea id="sessionNotes" rows="3" placeholder="Any additional details..." style="width:100%; padding:10px; border:1px solid var(--border); border-radius:10px; margin-bottom:15px;"></textarea>
                
                <button type="button" onclick="submitSessionProposal()" style="width:100%; padding:10px; background:var(--blue); color:white; border:none; border-radius:10px; font-weight:600; cursor:pointer;">Propose Session</button>
            </div>
        </div>
    </div>

    <nav class="topnav">
        <button class="hamburger nav-btn" onclick="toggleSidebar()"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="2" y1="5" x2="16" y2="5" /><line x1="2" y1="9" x2="16" y2="9" /><line x1="2" y1="13" x2="16" y2="13" /></svg></button>
        <div class="brand"><div class="brand-logo"><svg width="20" height="20" viewBox="0 0 28 28" fill="none"><path d="M7 9l7-5 7 5v10l-7 5-7-5V9z" fill="white" opacity="0.9" /></svg></div><span class="brand-name">SkillSwap PH</span></div>
       
        <div class="nav-actions"><a href="dashboard.html" class="nav-btn"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" /><rect x="14" y="3" width="7" height="7" /><rect x="14" y="14" width="7" height="7" /><rect x="3" y="14" width="7" height="7" /></svg></a>
            <a href="profile.html"><div class="avatar-btn" id="userAvatar">JD</div></a>
        </div>
    </nav>

    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <p class="sidebar-label">Navigation</p>
            <a href="dashboard.html" class="nav-link">📊 Dashboard</a>
            <a href="skills.html" class="nav-link">🔧 My Skills</a>
            <a href="matches.html" class="nav-link">🤝 Matches</a>
            <a href="exchanges.html" class="nav-link">🔄 Exchanges</a>
            <a href="messages.html" class="nav-link active">💬 Messages</a>
            <a href="profile.html" class="nav-link">👤 Profile</a>
            <div class="logout-btn"><button class="btn-logout" onclick="logout()">🚪 Log Out</button></div>
        </aside>

        <main class="main">
            <div class="page-header">
                <div>
                    <h1 class="page-title">💬 Messages</h1>
                    <p class="page-sub">Connect with your peers</p>
                </div>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('conversations')">Conversations</button>
                <button class="tab-btn" onclick="switchTab('connections')">Connections</button>
                <button class="tab-btn" onclick="switchTab('sessions')">📅 Sessions</button>
            </div>

            <div id="conversationsTab">
                <div class="messages-list" id="messagesList"><div class="empty-state">Loading conversations...</div></div>
            </div>

            <div id="connectionsTab" style="display: none;">
                <div class="connected-list" id="connectionsList"><div class="empty-state">Loading connections...</div></div>
            </div>

            <div id="sessionsTab" style="display: none;">
                <div class="sessions-list" id="sessionsList"><div class="empty-state">Loading sessions...</div></div>
            </div>
        </main>
    </div>

    <script>
        let conversations = [];
        let currentChatUser = null;
        let currentChatUserId = null;
        let chatHistory = [];
        let currentTab = 'conversations';
        let allConnections = [];
        let allSessions = [];
        let refreshInterval = null;

        // Make variables available globally for Firebase
        window.currentTab = currentTab;
        window.currentChatUserId = currentChatUserId;
        window.chatHistory = chatHistory;
        window.renderConversations = renderConversations;
        window.fetchMessages = fetchMessages;
        window.renderChatMessages = renderChatMessages;

        function showToast(msg, duration = 3000) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), duration);
        }

        function switchTab(tab) {
            currentTab = tab;
            window.currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            if (tab === 'conversations') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
                document.getElementById('conversationsTab').style.display = 'block';
                document.getElementById('connectionsTab').style.display = 'none';
                document.getElementById('sessionsTab').style.display = 'none';
                renderConversations();
            } else if (tab === 'connections') {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                document.getElementById('conversationsTab').style.display = 'none';
                document.getElementById('connectionsTab').style.display = 'block';
                document.getElementById('sessionsTab').style.display = 'none';
                loadConnections();
            } else {
                document.querySelector('.tab-btn:nth-child(3)').classList.add('active');
                document.getElementById('conversationsTab').style.display = 'none';
                document.getElementById('connectionsTab').style.display = 'none';
                document.getElementById('sessionsTab').style.display = 'block';
                loadSessions();
            }
        }

        async function fetchCurrentUser() {
            const token = localStorage.getItem('access_token');
            if (!token) return null;
            try {
                const response = await fetch(`${API_URL}/users/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) return null;
                return await response.json();
            } catch (error) {
                return null;
            }
        }

        async function fetchConversations() {
            const token = localStorage.getItem('access_token');
            if (!token) return [];
            try {
                const response = await fetch(`${API_URL}/messages/conversations`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) return [];
                return await response.json();
            } catch (error) {
                console.error('Fetch conversations error:', error);
                return [];
            }
        }

            } catch (error) {

        async function fetchMatches() {
            const token = localStorage.getItem('access_token');

        async function fetchExchanges() {
            const token = localStorage.getItem('access_token');

                const response = await fetch(`${API_URL}/exchanges`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                console.error('Fetch exchanges error:', error);

        async function fetchSessions() {
            const token = localStorage.getItem('access_token');
            if (!token) return [];
            try {
                const response = await fetch(`${API_URL}/sessions`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) return [];
                return await response.json();
            } catch (error) {
                console.error('Fetch sessions error:', error);
                return [];
            }
        }

        async function createSession(receiverId, skillTag, scheduledDate, notes) {
            const token = localStorage.getItem('access_token');
            if (!token) return false;
            try {
                const response = await fetch(`${API_URL}/sessions`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        receiver_id: receiverId,
                        skill_tag: skillTag,
                        scheduled_date: scheduledDate,
                        notes: notes
                    })
                });
                if (!response.ok) {
                    const error = await response.json();
                    showToast(error.detail || 'Failed to create session');
                    return false;
                }
                return await response.json();
            } catch (error) {
                console.error('Create session error:', error);
                return false;
            }
        }

        async function updateSessionStatus(sessionId, status) {
            const token = localStorage.getItem('access_token');
            if (!token) return false;
            try {
                const response = await fetch(`${API_URL}/sessions/${sessionId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: status })
                });
                if (!response.ok) return false;
                return true;
            } catch (error) {
                console.error('Update session error:', error);
                return false;
            }
        }

        async function sendMessage(receiverId, message) {
            const token = localStorage.getItem('access_token');
            if (!token) return false;
            try {
                const response = await fetch(`${API_URL}/messages/send`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ receiver_id: receiverId, message: message })
                });
                return response.ok;
            } catch (error) {
                console.error('Send message error:', error);
                return false;
            }
        }

        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            
            const token = localStorage.getItem('access_token');
            const response = await fetch(`${API_URL}/upload/file`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.detail || 'Upload failed');
            }
            return await response.json();
        }

        async function sendMessageWithAttachment(receiverId, fileName, fileUrl, fileType, fileSize) {
            const token = localStorage.getItem('access_token');
            const response = await fetch(`${API_URL}/messages/send`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    receiver_id: receiverId,
                    message: `📎 ${fileName}`,
                    attachment_url: fileUrl,
                    attachment_name: fileName,
                    attachment_type: fileType,
                    attachment_size: fileSize
                })
            });
            
            if (!response.ok) throw new Error('Failed to send message');
            return await response.json();
        }

        async function loadConnections() {
            const container = document.getElementById('connectionsList');
            container.innerHTML = '<div class="empty-state">Loading connections...</div>';
            
            const matches = await fetchMatches();
            const exchanges = await fetchExchanges();
            const currentUser = await fetchCurrentUser();
            const userId = currentUser?.id;
            
            const connectionsMap = new Map();
            
            matches.forEach(match => {
                if (match.user_id !== userId) {
                    connectionsMap.set(match.user_id, {
                        user_id: match.user_id,
                        username: match.username,
                        match_score: match.match_score,
                        source: 'match'
                    });
                }
            });
            
            exchanges.forEach(ex => {
                const otherId = ex.requester_id === userId ? ex.provider_id : ex.requester_id;
                const otherName = ex.requester_id === userId ? ex.provider_name : ex.requester_name;
                if (otherId !== userId) {
                    if (!connectionsMap.has(otherId)) {
                        connectionsMap.set(otherId, {
                            user_id: otherId,
                            username: otherName || 'User',
                            source: 'exchange',
                            status: ex.status
                        });
                    }
                }
            });
            
            allConnections = Array.from(connectionsMap.values());
            
            if (!allConnections.length) {
                container.innerHTML = '<div class="empty-state">💬 No connections yet. Go to Matches to find skill partners!</div>';
                return;
            }
            
            container.innerHTML = allConnections.map(conn => `
                <div class="connected-item" onclick="openChat('${conn.user_id}', '${(conn.username || 'User').replace(/'/g, "\\'")}')">
                    <div class="connected-avatar">${(conn.username || 'U').slice(0, 2).toUpperCase()}</div>
                    <div class="connected-info">
                        <div class="connected-name">${conn.username || 'User'}</div>
                        <div class="connected-skill">${conn.source === 'match' ? `Match Score: ${conn.match_score}%` : `Exchange: ${conn.status || 'Connected'}`}</div>
                    </div>
                    <button class="session-action-btn btn-confirm" style="padding:6px 12px;" onclick="event.stopPropagation(); openChat('${conn.user_id}', '${(conn.username || 'User').replace(/'/g, "\\'")}')">Message</button>
                </div>
            `).join('');
        }

        async function loadSessions() {
            const container = document.getElementById('sessionsList');
            container.innerHTML = '<div class="empty-state">Loading sessions...</div>';
            
            const sessions = await fetchSessions();
            const currentUser = await fetchCurrentUser();
            const userId = currentUser?.id;
            
            allSessions = sessions;
            
            if (!allSessions.length) {
                container.innerHTML = '<div class="empty-state">📅 No sessions yet. Propose a session from chat!</div>';
                return;
            }
            
            container.innerHTML = allSessions.map(session => {
                const otherPerson = session.is_mine ? session.receiver_name : session.proposer_name;
                const otherId = session.is_mine ? session.receiver_id : session.proposer_id;
                const statusClass = session.status === 'pending' ? 'status-pending' : 
                                   session.status === 'confirmed' ? 'status-confirmed' :
                                   session.status === 'completed' ? 'status-completed' : 'status-cancelled';
                const statusText = session.status.charAt(0).toUpperCase() + session.status.slice(1);
                const sessionDate = new Date(session.scheduled_date);
                const formattedDate = sessionDate.toLocaleString();
                
                let actionButtons = '';
                if (session.status === 'pending' && !session.is_mine) {
                    actionButtons = `
                        <div class="session-actions">
                            <button class="session-action-btn btn-confirm" onclick="event.stopPropagation(); handleSessionAction(${session.id}, 'confirmed')">Confirm</button>
                            <button class="session-action-btn btn-cancel" onclick="event.stopPropagation(); handleSessionAction(${session.id}, 'cancelled')">Cancel</button>
                        </div>
                    `;
                } else if (session.status === 'confirmed' && session.is_mine) {
                    actionButtons = `
                        <div class="session-actions">
                            <button class="session-action-btn btn-confirm" onclick="event.stopPropagation(); handleSessionAction(${session.id}, 'completed')">Mark Complete</button>
                        </div>
                    `;
                }
                
                return `
                    <div class="session-item" onclick="openChat('${otherId}', '${otherPerson.replace(/'/g, "\\'")}')">
                        <div class="session-avatar">${(otherPerson || 'U').slice(0, 2).toUpperCase()}</div>
                        <div class="session-info">
                            <div class="session-name">${otherPerson}</div>
                            <div class="session-skill">📚 ${session.skill_tag || 'General'}</div>
                            <div class="session-date">📅 ${formattedDate}</div>
                        </div>
                        <div>
                            <span class="session-status ${statusClass}">${statusText}</span>
                        </div>
                        ${actionButtons}
                    </div>
                `;
            }).join('');
        }

        async function handleSessionAction(sessionId, status) {
            const success = await updateSessionStatus(sessionId, status);
            if (success) {
                showToast(`✅ Session ${status}!`);
                await loadSessions();
            } else {
                showToast('❌ Failed to update session');
            }
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            const hours = diff / (1000 * 60 * 60);
            if (hours < 1) {
                const minutes = Math.floor(diff / (1000 * 60));
                return `${minutes} min ago`;
            } else if (hours < 24) {
                return `${Math.floor(hours)} hour${Math.floor(hours) !== 1 ? 's' : ''} ago`;
            } else {
                return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
            }
        }

        async function renderConversations() {
            const container = document.getElementById('messagesList');
            conversations = await fetchConversations();
            
            if (!conversations.length) {
                container.innerHTML = '<div class="empty-state">💬 No messages yet. Go to Connections tab to start a conversation!</div>';
                return;
            }
            
            container.innerHTML = conversations.map(conv => `
                <div class="message-card" onclick="openChat('${conv.user_id}', '${(conv.username || 'User').replace(/'/g, "\\'")}')">
                    <div class="message-avatar">${(conv.username || 'U').slice(0, 2).toUpperCase()}</div>
                    <div class="message-content">
                        <div class="message-sender">
                            <span class="message-name">${conv.username || 'User'}</span>
                            <span class="message-time">${formatDate(conv.last_message_time)}</span>
                        </div>
                        <div class="message-preview">${escapeHtml(conv.last_message?.substring(0, 50) || 'No messages')}</div>
                    </div>
                    ${conv.unread_count > 0 ? '<div class="unread-dot"></div>' : ''}
                </div>
            `).join('');
        }

        async function openChat(userId, userName) {
            if (!userId) {
                showToast('Invalid user');
                return;
            }
            
            currentChatUserId = userId;
            window.currentChatUserId = userId;
            currentChatUser = userName;
            
            try {
                const data = await fetchMessages(userId);
                chatHistory = data.messages || [];
                window.chatHistory = chatHistory;
            } catch (error) {
                chatHistory = [];
            }
            
            document.getElementById('chatModalTitle').textContent = `💬 Chat with ${userName}`;
            renderChatMessages();
            document.getElementById('chatModal').classList.add('show');
            
            if (refreshInterval) clearInterval(refreshInterval);
            
            refreshInterval = setInterval(async () => {
                if (currentChatUserId && document.getElementById('chatModal').classList.contains('show')) {
                    try {
                        const newData = await fetchMessages(currentChatUserId);
                        if (JSON.stringify(newData.messages) !== JSON.stringify(chatHistory)) {
                            chatHistory = newData.messages || [];
                            window.chatHistory = chatHistory;
                            renderChatMessages();
                            if (currentTab === 'conversations') {
                                await renderConversations();
                            }
                        }
                    } catch (e) {
                        console.error('Refresh error:', e);
                    }
                }
            }, 3000);
        }

        function renderChatMessages() {
            const container = document.getElementById('chatMessages');
            
            if (!chatHistory.length) {
                container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-light);">No messages yet. Send a message!</div>';
                return;
            }
            
            container.innerHTML = chatHistory.map(msg => {
                let attachmentHtml = '';
                if (msg.attachment_url && msg.attachment_name) {
                    attachmentHtml = `
                        <a href="${msg.attachment_url}" target="_blank" class="attachment-link" download>
                            📎 ${escapeHtml(msg.attachment_name)}
                        </a>
                    `;
                }
                
                return `
                    <div class="chat-message ${msg.is_mine ? 'sent' : 'received'}">
                        <div class="chat-bubble">
                            ${escapeHtml(msg.message || '')}
                            ${attachmentHtml}
                        </div>
                        <div class="chat-time">${formatDate(msg.created_at)}</div>
                    </div>
                `;
            }).join('');
            
            setTimeout(() => {
                container.scrollTop = container.scrollHeight;
            }, 50);
        }

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !currentChatUserId) return;
            
            const sendBtns = document.querySelectorAll('#chatModal .chat-input-area button');
            let sendBtn = null;
            for (let btn of sendBtns) {
                if (btn.textContent === 'Send') {
                    sendBtn = btn;
                    break;
                }
            }
            
            if (sendBtn) {
                sendBtn.disabled = true;
                sendBtn.textContent = 'Sending...';
            }
            
            const success = await sendMessage(currentChatUserId, text);
            
            if (success) {
                input.value = '';
                const data = await fetchMessages(currentChatUserId);
                chatHistory = data.messages || [];
                window.chatHistory = chatHistory;
                renderChatMessages();
                
                if (currentTab === 'conversations') {
                    conversations = await fetchConversations();
                    renderConversations();
                } else if (currentTab === 'connections') {
                    loadConnections();
                }
                
                showToast('✅ Message sent');
            } else {
                showToast('❌ Failed to send message');
            }
            
            if (sendBtn) {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send';
            }
        }

        // File upload handler
        const fileInput = document.getElementById('fileInput');
        if (fileInput) {
            fileInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                if (file.size > 10 * 1024 * 1024) {
                    showToast('❌ File too large. Max 10MB');
                    e.target.value = '';
                    return;
                }
                
                if (!currentChatUserId) {
                    showToast('Please select a conversation first');
                    e.target.value = '';
                    return;
                }
                
                showToast('📤 Uploading file...');
                
                try {
                    const result = await uploadFile(file);
                    
                    await sendMessageWithAttachment(
                        currentChatUserId, 
                        result.name, 
                        result.url,
                        result.type,
                        result.size
                    );
                    
                    showToast('✅ File uploaded and sent!');
                    
                    const data = await fetchMessages(currentChatUserId);
                    chatHistory = data.messages || [];
                    window.chatHistory = chatHistory;
                    renderChatMessages();
                    
                    if (currentTab === 'conversations') {
                        conversations = await fetchConversations();
                        renderConversations();
                    }
                    
                    e.target.value = '';
                } catch (error) {
                    showToast('❌ Upload failed: ' + error.message);
                }
            });
        }

        function openProposeSessionModal() {
            if (!currentChatUserId) {
                showToast('Please select a conversation first');
                return;
            }
            document.getElementById('sessionSkill').value = '';
            document.getElementById('sessionDateTime').value = '';
            document.getElementById('sessionNotes').value = '';
            document.getElementById('proposeSessionModal').classList.add('show');
        }

        function closeProposeSessionModal() {
            document.getElementById('proposeSessionModal').classList.remove('show');
        }

        async function submitSessionProposal() {
            if (!currentChatUserId) {
                showToast('No conversation selected');
                closeProposeSessionModal();
                return;
            }
            
            const skill = document.getElementById('sessionSkill').value.trim();
            const dateTime = document.getElementById('sessionDateTime').value;
            const notes = document.getElementById('sessionNotes').value.trim();
            
            if (!skill) {
                showToast('Please enter a skill/topic');
                return;
            }
            if (!dateTime) {
                showToast('Please select a date and time');
                return;
            }
            
            const submitBtn = document.querySelector('#proposeSessionModal button:last-child');
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Proposing...';
            }
            
            try {
                const result = await createSession(currentChatUserId, skill, dateTime, notes);
                
                if (result) {
                    showToast('✅ Session proposed!');
                    closeProposeSessionModal();
                    
                    await sendMessage(currentChatUserId, `📅 I proposed a session about "${skill}" on ${new Date(dateTime).toLocaleString()}. Check the Sessions tab!`);
                    
                    const data = await fetchMessages(currentChatUserId);
                    chatHistory = data.messages || [];
                    window.chatHistory = chatHistory;
                    renderChatMessages();
                    
                    if (currentTab === 'sessions') {
                        await loadSessions();
                    }
                } else {
                    showToast('❌ Failed to propose session');
                }
            } catch (error) {
                console.error('Session proposal error:', error);
                showToast('❌ Failed to propose session');
            } finally {
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Propose Session';
                }
            }
        }

        async function updateUserAvatar() {
            const user = await fetchCurrentUser();
            if (user) {
                document.getElementById('userAvatar').textContent = (user.username || 'US').slice(0, 2).toUpperCase();
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function closeChatModal() {
            document.getElementById('chatModal').classList.remove('show');
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
            currentChatUser = null;
            currentChatUserId = null;
            window.currentChatUserId = null;
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('navOverlay').classList.toggle('show');
        }

        function handleSearch(val) {
            if (!val.trim()) {
                if (currentTab === 'connections') loadConnections();
                return;
            }
            
            const searchTerm = val.toLowerCase();
            const filtered = allConnections.filter(conn => 
                conn.username && conn.username.toLowerCase().includes(searchTerm)
            );
            
            const container = document.getElementById('connectionsList');
            if (!filtered.length) {
                container.innerHTML = '<div class="empty-state">No matching connections found</div>';
                return;
            }
            
            container.innerHTML = filtered.map(conn => `
                <div class="connected-item" onclick="openChat('${conn.user_id}', '${(conn.username || 'User').replace(/'/g, "\\'")}')">
                    <div class="connected-avatar">${(conn.username || 'U').slice(0, 2).toUpperCase()}</div>
                    <div class="connected-info">
                        <div class="connected-name">${conn.username || 'User'}</div>
                        <div class="connected-skill">${conn.source === 'match' ? `Match Score: ${conn.match_score}%` : `Exchange: ${conn.status || 'Connected'}`}</div>
                    </div>
                    <button class="session-action-btn btn-confirm" style="padding:6px 12px;" onclick="event.stopPropagation(); openChat('${conn.user_id}', '${(conn.username || 'User').replace(/'/g, "\\'")}')">Message</button>
                </div>
            `).join('');
        }

        function clearSearchInput() {
            document.getElementById('searchInput').value = '';
            handleSearch('');
        }

        async function logout() {
            if (refreshInterval) clearInterval(refreshInterval);
            localStorage.removeItem('access_token');
            localStorage.removeItem('saved_email');
            localStorage.removeItem('user_email');
            window.location.href = 'index.html';
        }

        // Make functions global
        window.switchTab = switchTab;
        window.openChat = openChat;
        window.sendChatMessage = sendChatMessage;
        window.closeChatModal = closeChatModal;
        window.openProposeSessionModal = openProposeSessionModal;
        window.closeProposeSessionModal = closeProposeSessionModal;
        window.submitSessionProposal = submitSessionProposal;
        window.handleSessionAction = handleSessionAction;
        window.toggleSidebar = toggleSidebar;
        window.logout = logout;
        window.handleSearch = handleSearch;
        window.clearSearchInput = clearSearchInput;

        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = 'index.html';
                return;
            }
            await updateUserAvatar();
            await renderConversations();
            await loadConnections();
            await loadSessions();
        });

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');
    </script>
    <script src="config.js"></script>
